<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#13111c">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Avatars</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #13111c;
      --surface: #1c1730;
      --brd: #4c1d95;
      --p: #6d28d9;
      --p-lt: #7c3aed;
      --p-xl: #a78bfa;
      --p-text: #e2d9f3;
      --muted: #7c6fa0;
      --danger: #dc2626;
      --danger-lt: #ef4444;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      color: var(--p-text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px 16px 40px;
      gap: 12px;
      touch-action: manipulation;
      user-select: none;
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 60px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    .back-link:hover { color: var(--p-xl); }
    h1 {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      font-weight: 900;
      color: var(--p-xl);
      letter-spacing: 0.04em;
      text-align: center;
    }
    .new-btn {
      background: var(--p);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 6px 14px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s;
      min-width: 60px;
      text-align: right;
      font-family: inherit;
    }
    .new-btn:active { background: var(--p-lt); }
    .new-btn:disabled { opacity: 0.35; pointer-events: none; }

    /* ══════════════════════════════════════════
       LIST VIEW
    ══════════════════════════════════════════ */
    #view-list {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .avatar-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 2px solid var(--brd);
      border-radius: 14px;
      padding: 10px 12px;
      transition: border-color 0.15s;
    }
    .avatar-card.is-active { border-color: var(--p-lt); }
    .avatar-card-svg { flex-shrink: 0; }
    .avatar-card-svg svg { border-radius: 10px; display: block; overflow: hidden; }
    .avatar-card-info { flex: 1; min-width: 0; }
    .avatar-card-name {
      font-weight: 800;
      color: var(--p-xl);
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .active-pill {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--p-lt);
      border: 1.5px solid var(--p-lt);
      border-radius: 6px;
      padding: 1px 5px;
      margin-top: 3px;
      letter-spacing: 0.06em;
    }
    .coin-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #f0c040;
      margin-top: 3px;
    }
    .lifetime-stats {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }
    .avatar-card-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
    }
    .btn-coins {
      background: var(--bg);
      border: 1.5px solid #f0c040;
      border-radius: 8px;
      color: #f0c040;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .btn-coins:active { background: rgba(240,192,64,0.15); }
    .btn-add-coins {
      background: var(--bg);
      border: 1.5px solid #22c55e;
      border-radius: 8px;
      color: #22c55e;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .btn-add-coins:active { background: rgba(34,197,94,0.15); }

    .redeem-panel, .add-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(240,192,64,0.08);
      border: 1.5px solid #f0c040;
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      max-width: 520px;
    }
    .add-panel { background: rgba(34,197,94,0.08); border-color: #22c55e; }
    .redeem-panel.visible, .add-panel.visible { display: flex; }
    .redeem-title { font-size: 0.75rem; font-weight: 700; color: #f0c040; }
    .add-panel .redeem-title { color: #22c55e; }
    .quick-amounts { display: flex; gap: 6px; flex-wrap: wrap; }
    .quick-amount-btn {
      background: var(--bg);
      border: 1.5px solid #f0c040;
      border-radius: 8px;
      color: #f0c040;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 10px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .quick-amount-btn:active { background: rgba(240,192,64,0.15); }
    .add-panel .quick-amount-btn { border-color: #22c55e; color: #22c55e; }
    .add-panel .quick-amount-btn:active { background: rgba(34,197,94,0.15); }
    .btn-add-submit {
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: #0b2c17;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 7px 12px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .redeem-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .redeem-row input {
      flex: 1;
      min-width: 90px;
      background: var(--bg);
      border: 2px solid var(--brd);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--p-text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    .redeem-row input:focus { border-color: #f0c040; }
    .add-panel .redeem-row input:focus { border-color: #22c55e; }
    .btn-redeem-submit {
      background: #f0c040;
      border: none;
      border-radius: 8px;
      color: #1c1730;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 7px 12px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .btn-redeem-cancel {
      background: none;
      border: 1.5px solid var(--muted);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 7px 12px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .redeem-error { font-size: 0.72rem; color: var(--danger-lt); font-weight: 700; min-height: 1em; }
    .btn-select {
      background: var(--p);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      transition: background 0.12s;
    }
    .btn-select:active { background: var(--p-lt); }
    .btn-select.is-active { background: var(--p-lt); opacity: 0.5; pointer-events: none; }
    .btn-edit {
      background: var(--bg);
      border: 1.5px solid var(--brd);
      border-radius: 8px;
      color: var(--p-xl);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .btn-edit:active { border-color: var(--p-lt); }
    .btn-delete {
      background: none;
      border: 1.5px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      font-size: 1rem;
      padding: 5px 7px;
      cursor: pointer;
      touch-action: manipulation;
      line-height: 1;
    }
    .btn-delete:active { color: var(--danger-lt); border-color: var(--danger-lt); }

    .delete-confirm {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(220,38,38,0.12);
      border: 1.5px solid var(--danger);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.75rem;
      color: var(--danger-lt);
      font-weight: 700;
      width: 100%;
      max-width: 520px;
    }
    .delete-confirm.visible { display: flex; }
    .delete-confirm-text { flex: 1; }
    .btn-confirm-delete {
      background: var(--danger);
      border: none;
      border-radius: 7px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-cancel-delete {
      background: none;
      border: 1.5px solid var(--muted);
      border-radius: 7px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state-text { font-size: 1rem; margin-bottom: 20px; }
    .btn-create-first {
      background: var(--p-lt);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      padding: 12px 28px;
      cursor: pointer;
      font-family: inherit;
    }

    /* ══════════════════════════════════════════
       EDITOR VIEW
    ══════════════════════════════════════════ */
    #view-editor {
      display: none;
      width: 100%;
      max-width: 520px;
      flex-direction: column;
      gap: 12px;
    }
    #view-editor.active { display: flex; }

    .preview-card {
      position: sticky;
      top: 8px;
      z-index: 5;
      background: var(--surface);
      border: 2px solid var(--brd);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    #preview-svg svg {
      width: clamp(120px, 35vw, 160px);
      height: clamp(120px, 35vw, 160px);
      border-radius: 20px;
      display: block;
      overflow: hidden;
    }
    #preview-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--p-xl);
      letter-spacing: 0.04em;
      min-height: 1.4em;
    }

    .section {
      background: var(--surface);
      border: 2px solid var(--brd);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-group { display: flex; flex-direction: column; gap: 7px; }
    .control-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .text-input {
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--brd);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--p-text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    .text-input:focus { border-color: var(--p-lt); }
    .text-input.shake { animation: input-shake 0.35s ease-out; }
    @keyframes input-shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s, border-color 0.1s;
      flex-shrink: 0;
    }
    .swatch:active { transform: scale(0.88); }
    .swatch.active { border-color: var(--p-xl); outline: 2px solid white; outline-offset: -6px; }

    .option-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .option-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 10px;
      border: 2px solid var(--brd);
      background: var(--bg);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-family: inherit;
    }
    .option-btn svg { display: block; }
    .option-btn:active { transform: scale(0.93); }
    .option-btn.active { background: var(--p); border-color: var(--p-lt); color: #fff; }

    .save-btn {
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--p-lt);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }
    .save-btn:active { background: var(--p); transform: scale(0.97); }

    /* Sub-rows shown/hidden based on selection */
    .sub-row { display: none; }
    .sub-row.visible { display: flex; flex-direction: column; gap: 7px; }
  </style>
</head>
<body>

  <!-- ── LIST VIEW ─────────────────────────────────── -->
  <div class="topbar" id="topbar-list">
    <a class="back-link" href="index.html">← Back</a>
    <h1>Avatars</h1>
    <button class="new-btn" id="btn-new">+ New</button>
  </div>

  <div id="view-list"></div>

  <!-- ── EDITOR VIEW ───────────────────────────────── -->
  <div class="topbar" id="topbar-editor" style="display:none">
    <button class="back-link" id="btn-back-editor">← Back</button>
    <h1 id="editor-title">New Avatar</h1>
    <div style="min-width:60px"></div>
  </div>

  <div id="view-editor">

    <!-- Preview -->
    <div class="preview-card">
      <div id="preview-svg"></div>
      <div id="preview-name">Player</div>
    </div>

    <!-- Nickname -->
    <div class="section">
      <div class="control-group">
        <div class="control-label">Nickname</div>
        <input type="text" id="nickname-input" class="text-input" maxlength="16" placeholder="Enter name…"
               autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
    </div>

    <!-- Background + Face + Skin -->
    <div class="section">
      <div class="control-group">
        <div class="control-label">Background</div>
        <div class="swatch-row" id="bg-swatches"></div>
      </div>
      <div class="control-group">
        <div class="control-label">Background Scene</div>
        <div class="option-row" id="bgscene-options"></div>
      </div>
      <div class="control-group">
        <div class="control-label">Face Shape</div>
        <div class="option-row" id="face-options"></div>
      </div>
      <div class="control-group">
        <div class="control-label">Skin Color</div>
        <div class="swatch-row" id="skin-swatches"></div>
      </div>
    </div>

    <!-- Eyes + Brows + Nose + Mouth + Dimples -->
    <div class="section">
      <div class="control-group">
        <div class="control-label">Eyes</div>
        <div class="option-row" id="eye-options"></div>
      </div>
      <div class="control-group">
        <div class="control-label">Eyebrows</div>
        <div class="option-row" id="brow-options"></div>
      </div>
      <div class="control-group">
        <div class="control-label">Nose</div>
        <div class="option-row" id="nose-options"></div>
      </div>
      <div class="control-group">
        <div class="control-label">Mouth</div>
        <div class="option-row" id="mouth-options"></div>
      </div>
      <div class="control-group">
        <div class="control-label">Dimples</div>
        <div class="option-row" id="dimple-options"></div>
        <div class="sub-row" id="dimple-color-row">
          <div class="control-label">Dimple Color</div>
          <div class="swatch-row" id="dimple-swatches"></div>
        </div>
      </div>
    </div>

    <!-- Hair -->
    <div class="section">
      <div class="control-group">
        <div class="control-label">Hair Style</div>
        <div class="option-row" id="hair-options"></div>
      </div>
      <div class="sub-row" id="hair-color-row">
        <div class="control-label">Hair Color</div>
        <div class="swatch-row" id="hair-swatches"></div>
      </div>
    </div>

    <!-- Extras: Glasses + Headwear -->
    <div class="section">
      <div class="control-group">
        <div class="control-label">Glasses</div>
        <div class="option-row" id="glasses-options"></div>
        <div class="sub-row" id="glasses-color-row">
          <div class="control-label">Glasses Color</div>
          <div class="swatch-row" id="glasses-swatches"></div>
        </div>
      </div>
      <div class="control-group">
        <div class="control-label">Headwear</div>
        <div class="option-row" id="hat-options"></div>
      </div>
      <div class="sub-row" id="hat-color-row">
        <div class="control-label">Headwear Color</div>
        <div class="swatch-row" id="hat-swatches"></div>
      </div>
    </div>

    <button class="save-btn" id="save-btn">Create Avatar</button>
  </div>

<script src="version.js"></script>
<script src="sync-registry.js"></script>
<script src="sync-merge.js"></script>
<script src="sync-drive.js"></script>
<script src="sync-ui.js"></script>
<script src="avatar.js"></script>
<script src="app.js"></script>
<script>
(function () {

  function escHtml(str) {

  var GLASSES_COLORS = [
    '#1a1a2e','#0f172a','#7c2d12','#78350f','#450a0a',

  ];

  // ── Mini preview SVG builders ─────────────────────────────────────────────
  // 30×30 viewBox, using consistent tones for demonstration

  var OPTION_PREVIEWS = {

  var OPTION_DEFS = {

  // ══════════════════════════════════════════
  // LIST VIEW
  // ══════════════════════════════════════════

  function showListView() {
    editingId = null;
    document.getElementById('topbar-list').style.display = '';
    document.getElementById('topbar-editor').style.display = 'none';
    document.getElementById('view-list').style.display = '';
    document.getElementById('view-editor').classList.remove('active');
    renderListView();
  }

  function renderListView() {
    var container = document.getElementById('view-list');
    container.innerHTML = '';
    var list = loadAvatars();
    var activeId = getActiveId();

    document.getElementById('btn-new').disabled = list.length >= 10;

    if (list.length === 0) {
      container.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state-icon">🧑</div>' +
          '<div class="empty-state-text">No avatars yet — create one!</div>' +
          '<button class="btn-create-first" id="btn-create-first">Create Your First Avatar</button>' +
        '</div>';
      document.getElementById('btn-create-first').addEventListener('click', function() {
        showEditorView(null);
      });
      return;
    }

    list.forEach(function(avatar) {
      var isActive = avatar.id === activeId;

      var card = document.createElement('div');
      card.className = 'avatar-card' + (isActive ? ' is-active' : '');
      card.innerHTML =
        '<div class="avatar-card-svg">' + renderSVG(avatar, '52') + '</div>' +
        '<div class="avatar-card-info">' +
          '<div class="avatar-card-name">' + escHtml(avatar.nickname) + '</div>' +
          '<div class="coin-pill">🪙 ' + (avatar.coins || 0) + '</div>' +
          '<div class="lifetime-stats">Lifetime: +' + (avatar.totalEarned || 0) + ' earned · -' + (avatar.totalSpent || 0) + ' spent</div>' +
          (isActive ? '<div class="active-pill">ACTIVE</div>' : '') +
        '</div>' +
        '<div class="avatar-card-actions">' +
          (!isActive ? '<button class="btn-select" data-id="' + avatar.id + '">Select</button>' :
                       '<button class="btn-select is-active" disabled>Active</button>') +
          '<button class="btn-add-coins" data-id="' + avatar.id + '" title="Add coins">➕</button>' +
          '<button class="btn-coins" data-id="' + avatar.id + '" title="Deduct coins">🪙</button>' +
          '<button class="btn-edit" data-id="' + avatar.id + '">Edit</button>' +
          (list.length > 1 ? '<button class="btn-delete" data-id="' + avatar.id + '" title="Delete">🗑</button>' : '') +
        '</div>';

      var confirmRow = document.createElement('div');
      confirmRow.className = 'delete-confirm';
      confirmRow.id = 'confirm-' + avatar.id;
      confirmRow.innerHTML =
        '<span class="delete-confirm-text">Delete "' + escHtml(avatar.nickname) + '"?</span>' +
        '<button class="btn-cancel-delete" data-id="' + avatar.id + '">Cancel</button>' +
        '<button class="btn-confirm-delete" data-id="' + avatar.id + '">Delete</button>';

      var addRow = document.createElement('div');
      addRow.className = 'add-panel';
      addRow.id = 'addcoins-' + avatar.id;
      addRow.innerHTML =
        '<div class="redeem-title">Add coins to ' + escHtml(avatar.nickname) + ' (balance: ' + (avatar.coins || 0) + ')</div>' +
        '<div class="quick-amounts">' +
          '<button class="quick-amount-btn" data-id="' + avatar.id + '" data-panel="add" data-amount="1">+1</button>' +
          '<button class="quick-amount-btn" data-id="' + avatar.id + '" data-panel="add" data-amount="5">+5</button>' +
          '<button class="quick-amount-btn" data-id="' + avatar.id + '" data-panel="add" data-amount="10">+10</button>' +
          '<button class="quick-amount-btn" data-id="' + avatar.id + '" data-panel="add" data-amount="20">+20</button>' +
        '</div>' +
        '<div class="redeem-row">' +
          '<input type="number" inputmode="numeric" min="1" step="1" class="add-amount" placeholder="Amount" data-id="' + avatar.id + '">' +
          '<input type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="add-pin" placeholder="PIN" data-id="' + avatar.id + '">' +
        '</div>' +
        '<div class="redeem-row">' +
          '<button class="btn-add-submit" data-id="' + avatar.id + '">Add</button>' +
          '<button class="btn-redeem-cancel" data-id="' + avatar.id + '" data-panel="add">Cancel</button>' +
        '</div>' +
        '<div class="redeem-error" id="add-error-' + avatar.id + '"></div>';

      var redeemRow = document.createElement('div');
      redeemRow.className = 'redeem-panel';
      redeemRow.id = 'redeem-' + avatar.id;
      redeemRow.innerHTML =
        '<div class="redeem-title">Deduct coins from ' + escHtml(avatar.nickname) + ' (balance: ' + (avatar.coins || 0) + ')</div>' +
        '<div class="quick-amounts">' +
          '<button class="quick-amount-btn" data-id="' + avatar.id + '" data-panel="redeem" data-amount="1">-1</button>' +
          '<button class="quick-amount-btn" data-id="' + avatar.id + '" data-panel="redeem" data-amount="5">-5</button>' +
          '<button class="quick-amount-btn" data-id="' + avatar.id + '" data-panel="redeem" data-amount="10">-10</button>' +
          '<button class="quick-amount-btn" data-id="' + avatar.id + '" data-panel="redeem" data-amount="20">-20</button>' +
        '</div>' +
        '<div class="redeem-row">' +
          '<input type="number" inputmode="numeric" min="1" step="1" class="redeem-amount" placeholder="Amount" data-id="' + avatar.id + '">' +
          '<input type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="redeem-pin" placeholder="PIN" data-id="' + avatar.id + '">' +
        '</div>' +
        '<div class="redeem-row">' +
          '<button class="btn-redeem-submit" data-id="' + avatar.id + '">Deduct</button>' +
          '<button class="btn-redeem-cancel" data-id="' + avatar.id + '">Cancel</button>' +
        '</div>' +
        '<div class="redeem-error" id="redeem-error-' + avatar.id + '"></div>';

      container.appendChild(card);
      container.appendChild(confirmRow);
      container.appendChild(addRow);
      container.appendChild(redeemRow);
    });

    container.addEventListener('click', function(e) {
      var t = e.target;
      var id = t.dataset.id;
      if (!id) return;

      if (t.classList.contains('btn-select')) {
        try { localStorage.setItem('puzzles-avatar-active', id); } catch(err) {}
        renderListView();
      } else if (t.classList.contains('btn-edit')) {
        showEditorView(id);
      } else if (t.classList.contains('btn-delete')) {
        closeAllPanels();
        document.getElementById('confirm-' + id).classList.add('visible');
      } else if (t.classList.contains('btn-cancel-delete')) {
        document.getElementById('confirm-' + id).classList.remove('visible');
      } else if (t.classList.contains('btn-confirm-delete')) {
        deleteAvatar(id);
      } else if (t.classList.contains('btn-coins')) {
        var panel = document.getElementById('redeem-' + id);
        var wasVisible = panel.classList.contains('visible');
        closeAllPanels();
        if (!wasVisible) {
          panel.classList.add('visible');
          var amountInput = panel.querySelector('.redeem-amount');
          if (amountInput) amountInput.focus();
        }
      } else if (t.classList.contains('btn-add-coins')) {
        var addPanel = document.getElementById('addcoins-' + id);
        var addWasVisible = addPanel.classList.contains('visible');
        closeAllPanels();
        if (!addWasVisible) {
          addPanel.classList.add('visible');
          var addAmountInput = addPanel.querySelector('.add-amount');
          if (addAmountInput) addAmountInput.focus();
        }
      } else if (t.classList.contains('quick-amount-btn')) {
        var field = t.dataset.panel === 'add' ?
          document.querySelector('#addcoins-' + id + ' .add-amount') :
          document.querySelector('#redeem-' + id + ' .redeem-amount');
        if (field) field.value = t.dataset.amount;
      } else if (t.classList.contains('btn-redeem-cancel')) {
        if (t.dataset.panel === 'add') closeAddPanel(id); else closeRedeemPanel(id);
      } else if (t.classList.contains('btn-redeem-submit')) {
        submitRedeem(id);
      } else if (t.classList.contains('btn-add-submit')) {
        submitAdd(id);
      }
    });

    container.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      var id = e.target.dataset.id;
      if (!id) return;
      if (e.target.classList.contains('redeem-amount') || e.target.classList.contains('redeem-pin')) {
        e.preventDefault();
        submitRedeem(id);
      } else if (e.target.classList.contains('add-amount') || e.target.classList.contains('add-pin')) {
        e.preventDefault();
        submitAdd(id);
      }
    });
  }

  function closeAllPanels() {
    document.querySelectorAll('.delete-confirm.visible').forEach(function(el){ el.classList.remove('visible'); });
    document.querySelectorAll('.redeem-panel.visible').forEach(function(el){ el.classList.remove('visible'); });
    document.querySelectorAll('.add-panel.visible').forEach(function(el){ el.classList.remove('visible'); });
  }

  function closeRedeemPanel(id) {
    var panel = document.getElementById('redeem-' + id);
    if (!panel) return;
    panel.classList.remove('visible');
    panel.querySelector('.redeem-amount').value = '';
    panel.querySelector('.redeem-pin').value = '';
    document.getElementById('redeem-error-' + id).textContent = '';
  }

  function closeAddPanel(id) {
    var panel = document.getElementById('addcoins-' + id);
    if (!panel) return;
    panel.classList.remove('visible');
    panel.querySelector('.add-amount').value = '';
    panel.querySelector('.add-pin').value = '';
    document.getElementById('add-error-' + id).textContent = '';
  }

  var REDEEM_PIN = '9112';

  function submitRedeem(id) {
    var panel = document.getElementById('redeem-' + id);
    var errorEl = document.getElementById('redeem-error-' + id);
    var amount = parseInt(panel.querySelector('.redeem-amount').value, 10);
    var pin = panel.querySelector('.redeem-pin').value.trim();

    if (!amount || amount <= 0) {
      errorEl.textContent = 'Enter a valid coin amount.';
      return;
    }
    if (pin !== REDEEM_PIN) {
      errorEl.textContent = 'Incorrect PIN.';
      panel.querySelector('.redeem-pin').value = '';
      return;
    }
    var newBalance = window.__avatarDeductCoins ? window.__avatarDeductCoins(id, amount) : null;
    if (newBalance === null) {
      errorEl.textContent = 'Insufficient balance.';
      return;
    }
    closeRedeemPanel(id);
    renderListView();
  }

  function submitAdd(id) {
    var panel = document.getElementById('addcoins-' + id);
    var errorEl = document.getElementById('add-error-' + id);
    var amount = parseInt(panel.querySelector('.add-amount').value, 10);
    var pin = panel.querySelector('.add-pin').value.trim();

    if (!amount || amount <= 0) {
      errorEl.textContent = 'Enter a valid coin amount.';
      return;
    }
    if (pin !== REDEEM_PIN) {
      errorEl.textContent = 'Incorrect PIN.';
      panel.querySelector('.add-pin').value = '';
      return;
    }
    if (!window.__avatarAddCoins) return;
    window.__avatarAddCoins(id, amount);
    closeAddPanel(id);
    renderListView();
  }

  function deleteAvatar(id) {
    var list = loadAvatars().filter(function(a){ return a.id !== id; });
    saveAvatars(list);
    if (getActiveId() === id) {
      try { localStorage.setItem('puzzles-avatar-active', list.length ? list[0].id : ''); } catch(e) {}
    }
    renderListView();
  }

  // ══════════════════════════════════════════
  // EDITOR VIEW
  // ══════════════════════════════════════════

  function showEditorView(avatarId) {
    editingId = avatarId;

    // Always reset to defaults first so avatars saved before newer fields
    // existed (e.g. browStyle, hatStyle) don't inherit the last-edited values.
    Object.assign(editorState, {
      nickname: '', bgColor: '#6d28d9', bgScene: 'none', faceShape: 'circle',
      skinColor: '#f5cba7', eyeStyle: 'round', noseStyle: 'dot',
      mouthStyle: 'smile', hairStyle: 'short', hairColor: '#2c1810',
      dimpleStyle: 'none', dimpleColor: '#ffb3c6',
      browStyle: 'none', glassesStyle: 'none', glassesColor: '#1a1a2e',
      hatStyle: 'none', hatColor: '#ef4444'
    });
    if (avatarId) {
      var list = loadAvatars();
      var av = list.find(function(a){ return a.id === avatarId; });
      if (av) Object.assign(editorState, av);
    }

    document.getElementById('topbar-list').style.display = 'none';
    document.getElementById('topbar-editor').style.display = '';
    document.getElementById('view-list').style.display = 'none';
    document.getElementById('view-editor').classList.add('active');
    document.getElementById('editor-title').textContent = avatarId ? 'Edit Avatar' : 'New Avatar';
    document.getElementById('save-btn').textContent = avatarId ? 'Save Changes' : 'Create Avatar';

    document.getElementById('nickname-input').value = editorState.nickname || '';

    // Refresh all controls to match editorState
    refreshSwatchActive('bg-swatches',     'bgColor');
    refreshSwatchActive('skin-swatches',   'skinColor');
    refreshSwatchActive('hair-swatches',   'hairColor');
    refreshSwatchActive('dimple-swatches', 'dimpleColor');
    refreshSwatchActive('glasses-swatches','glassesColor');
    refreshSwatchActive('hat-swatches',    'hatColor');
    refreshOptionActive('bgscene-options', 'bgScene');
    refreshOptionActive('face-options',    'faceShape');
    refreshOptionActive('eye-options',     'eyeStyle');
    refreshOptionActive('brow-options',    'browStyle');
    refreshOptionActive('nose-options',    'noseStyle');
    refreshOptionActive('mouth-options',   'mouthStyle');
    refreshOptionActive('dimple-options',  'dimpleStyle');
    refreshOptionActive('hair-options',    'hairStyle');
    refreshOptionActive('glasses-options', 'glassesStyle');
    refreshOptionActive('hat-options',     'hatStyle');

    updateSubRowVisibility();
    updatePreview();
  }

  function refreshSwatchActive(containerId, key) {
    document.getElementById(containerId).querySelectorAll('.swatch').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('aria-label') === editorState[key]);
    });
  }

  function refreshOptionActive(containerId, key) {
    document.getElementById(containerId).querySelectorAll('.option-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.value === editorState[key]);
    });
  }

  function updatePreview() {
    document.getElementById('preview-svg').innerHTML = renderSVG(editorState, '140');
    document.getElementById('preview-name').textContent = editorState.nickname.trim() || 'Player';
  }

  function updateSubRowVisibility() {
    // Hair color only shown when hair is not 'none'
    document.getElementById('hair-color-row').classList.toggle('visible', editorState.hairStyle !== 'none');
    // Dimple color only shown when dimple is not 'none'
    document.getElementById('dimple-color-row').classList.toggle('visible', editorState.dimpleStyle !== 'none');
    // Glasses color only shown when glasses is not 'none'
    document.getElementById('glasses-color-row').classList.toggle('visible', editorState.glassesStyle !== 'none');
    // Hat color only shown when headwear is not 'none'
    document.getElementById('hat-color-row').classList.toggle('visible', editorState.hatStyle !== 'none');
  }

  // ── Build controls ────────────────────────────────────────────────────────

  function buildSwatches(containerId, colors, stateKey) {
    var container = document.getElementById(containerId);
    colors.forEach(function(color) {
      var btn = document.createElement('button');
      btn.className = 'swatch' + (editorState[stateKey] === color ? ' active' : '');
      btn.style.background = color;
      btn.setAttribute('aria-label', color);
      btn.addEventListener('click', function() {
        editorState[stateKey] = color;
        container.querySelectorAll('.swatch').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        updateSubRowVisibility();
        updatePreview();
      });
      container.appendChild(btn);
    });
  }

  function buildOptions(containerId, stateKey) {
    var container = document.getElementById(containerId);
    OPTION_DEFS[stateKey].forEach(function(def) {
      var btn = document.createElement('button');
      btn.className = 'option-btn' + (editorState[stateKey] === def.value ? ' active' : '');
      btn.dataset.value = def.value;
      var previewMap = OPTION_PREVIEWS[stateKey];
      var previewSVG = (previewMap && previewMap[def.value]) ? previewMap[def.value]() : '';
      btn.innerHTML = previewSVG + '<span>' + def.label + '</span>';
      btn.addEventListener('click', function() {
        editorState[stateKey] = def.value;
        container.querySelectorAll('.option-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        updateSubRowVisibility();
        updatePreview();
      });
      container.appendChild(btn);
    });
  }

  // ── Save ──────────────────────────────────────────────────────────────────

  document.getElementById('save-btn').addEventListener('click', function() {
    var nick = document.getElementById('nickname-input').value.trim();
    if (!nick) {
      var input = document.getElementById('nickname-input');
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      input.focus();
      return;
    }
    editorState.nickname = nick;

    var list = loadAvatars();
    if (editingId) {
      var idx = list.findIndex(function(a){ return a.id === editingId; });
      if (idx >= 0) {
        var preserved = list[idx].scores || {};
        var preservedCoins = list[idx].coins || 0;
        var preservedCoinsAt = list[idx].coinsUpdatedAt || null;
        list[idx] = Object.assign({}, editorState, { id: editingId, scores: preserved, coins: preservedCoins, coinsUpdatedAt: preservedCoinsAt });
      }
    } else {
      var newAvatar = Object.assign({}, editorState, { id: 'av_' + Date.now(), scores: {}, coins: 0 });
      list.push(newAvatar);
      if (list.length === 1) {
        try { localStorage.setItem('puzzles-avatar-active', newAvatar.id); } catch(e) {}
      }
    }
    saveAvatars(list);
    showListView();
  });

  document.getElementById('nickname-input').addEventListener('input', function() {
    editorState.nickname = this.value;
    updatePreview();
  });

  document.getElementById('btn-back-editor').addEventListener('click', showListView);
  document.getElementById('btn-new').addEventListener('click', function() { showEditorView(null); });

  // ── Init ──────────────────────────────────────────────────────────────────

  buildSwatches('bg-swatches',     BG_COLORS,     'bgColor');
  buildSwatches('skin-swatches',   SKIN_COLORS,   'skinColor');
  buildSwatches('hair-swatches',   HAIR_COLORS,   'hairColor');
  buildSwatches('dimple-swatches', DIMPLE_COLORS, 'dimpleColor');
  buildSwatches('glasses-swatches',GLASSES_COLORS,'glassesColor');
  buildSwatches('hat-swatches',    HAT_COLORS,    'hatColor');
  buildOptions('bgscene-options', 'bgScene');
  buildOptions('face-options',    'faceShape');
  buildOptions('eye-options',     'eyeStyle');
  buildOptions('brow-options',    'browStyle');
  buildOptions('nose-options',    'noseStyle');
  buildOptions('mouth-options',   'mouthStyle');
  buildOptions('dimple-options',  'dimpleStyle');
  buildOptions('hair-options',    'hairStyle');
  buildOptions('glasses-options', 'glassesStyle');
  buildOptions('hat-options',     'hatStyle');

  showListView();

  // Keep coin balances current if a background sync updates them while the
  // list view is open.
  window.addEventListener('pz-avatar-coins-change', function() {
    if (document.getElementById('view-list').style.display !== 'none') renderListView();
  });

})();
</script>
</body>
</html>
