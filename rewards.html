<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#13111c">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Rewards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #13111c;
      --surface: #1c1730;
      --brd: #4c1d95;
      --p: #6d28d9;
      --p-lt: #7c3aed;
      --p-xl: #a78bfa;
      --p-text: #e2d9f3;
      --muted: #7c6fa0;
      --gold: #f0c040;
      --earn: #22c55e;
      --danger: #dc2626;
      --danger-lt: #ef4444;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      color: var(--p-text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px 16px 40px;
      gap: 14px;
      touch-action: manipulation;
      user-select: none;
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 60px;
    }
    .back-link:hover { color: var(--p-xl); }
    h1 {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      font-weight: 900;
      color: var(--p-xl);
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* ── Avatar summary card ── */
    .summary-card {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 2px solid var(--brd);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .summary-card svg { border-radius: 14px; display: block; overflow: hidden; flex-shrink: 0; }
    .summary-name { font-size: 1.1rem; font-weight: 800; color: var(--p-xl); }
    .summary-balance {
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--gold);
      margin-top: 2px;
    }
    .summary-balance .unit { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
    .summary-lifetime { font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-top: 4px; }

    /* ── Sections ── */
    .section {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 2px solid var(--brd);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Earn buttons ── */
    .earn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-earn {
      flex: 1;
      min-width: 64px;
      background: var(--bg);
      border: 1.5px solid var(--earn);
      border-radius: 10px;
      color: var(--earn);
      font-size: 0.95rem;
      font-weight: 800;
      padding: 10px 8px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .btn-earn:active { background: rgba(34,197,94,0.15); }

    /* ── Reward cards ── */
    .reward-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 2px solid var(--brd);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .reward-icon { font-size: 1.8rem; flex-shrink: 0; }
    .reward-info { flex: 1; min-width: 0; }
    .reward-title { font-weight: 800; font-size: 0.95rem; }
    .reward-cost { font-size: 0.78rem; font-weight: 700; color: var(--gold); margin-top: 2px; }
    .btn-exchange {
      background: var(--p);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 8px 14px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      flex-shrink: 0;
    }
    .btn-exchange:active { background: var(--p-lt); }
    .btn-exchange:disabled { opacity: 0.4; pointer-events: none; }

    .exchange-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(109,40,217,0.12);
      border: 1.5px solid var(--p-lt);
      border-radius: 10px;
      padding: 10px;
    }
    .exchange-panel.visible { display: flex; }
    .exchange-panel-title { font-size: 0.78rem; font-weight: 700; color: var(--p-xl); }
    .exchange-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .exchange-row input {
      flex: 1;
      min-width: 90px;
      background: var(--bg);
      border: 2px solid var(--brd);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--p-text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    .exchange-row input:focus { border-color: var(--p-lt); }
    .btn-exchange-confirm {
      background: var(--p);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 7px 12px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .btn-exchange-cancel {
      background: none;
      border: 1.5px solid var(--muted);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 7px 12px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .exchange-error { font-size: 0.72rem; color: var(--danger-lt); font-weight: 700; min-height: 1em; }

    .earn-panel { background: rgba(34,197,94,0.1); border-color: var(--earn); }
    .earn-panel .exchange-panel-title { color: var(--earn); }
    .earn-panel .exchange-row input:focus { border-color: var(--earn); }
    .btn-earn-confirm {
      background: var(--earn);
      border: none;
      border-radius: 8px;
      color: #0b2c17;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 7px 12px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }

    /* ── History ── */
    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 10px;
      font-size: 0.82rem;
    }
    .history-label { font-weight: 700; }
    .history-time { color: var(--muted); font-size: 0.7rem; }
    .history-cost { color: var(--danger-lt); font-weight: 800; flex-shrink: 0; }
    .history-empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 10px 0; }

    .empty-state {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state-text { font-size: 1rem; margin-bottom: 20px; }
    .btn-create-first {
      background: var(--p-lt);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      padding: 12px 28px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back-link" href="index.html">← Back</a>
    <h1>Rewards</h1>
    <div style="min-width:60px"></div>
  </div>

  <div id="rewards-root" style="width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;align-items:center;"></div>

<script src="version.js"></script>
<script src="sync-registry.js"></script>
<script src="sync-merge.js"></script>
<script src="sync-drive.js"></script>
<script src="sync-ui.js"></script>
<script src="avatar.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';

  var loadAvatars  = window.__avatarLoadAvatars;
  var getActive    = window.__avatarGetActive;
  var renderSVG    = window.__avatarRender;

  var REWARDS = [
    { id: 'series', icon: '📺', title: 'Watch a series', cost: 20 },
    { id: 'movie',  icon: '🎬', title: 'Watch a movie',  cost: 60 }
  ];

  var EXCHANGE_PIN = '9112';
  var openExchangeId = null;
  var openEarnAmount = null;

  var root = document.getElementById('rewards-root');

  function escHtml(str) {
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function relTime(iso) {
    if (!iso) return '';
    var ms = Date.parse(iso);
    if (isNaN(ms)) return '';
    var d = Date.now() - ms;
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.floor(d / 60000) + ' min ago';
    if (d < 86400000) return Math.floor(d / 3600000) + ' hr ago';
    return Math.floor(d / 86400000) + ' day(s) ago';
  }

  function render() {
    var avatar = getActive();

    if (!avatar) {
      root.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state-icon">🎁</div>' +
          '<div class="empty-state-text">No avatar yet — create one to start earning rewards!</div>' +
          '<a class="btn-create-first" href="avatar.html">Create Your Avatar</a>' +
        '</div>';
      return;
    }

    var balance = avatar.coins || 0;
    var stats = window.__avatarGetCoinStats ? window.__avatarGetCoinStats(avatar.id) : { earned: 0, spent: 0 };
    var exchanges = window.__avatarGetExchanges ? window.__avatarGetExchanges(avatar.id) : [];

    var html = '';

    // ── Summary card ──────────────────────────────────────────────────────
    html +=
      '<div class="summary-card">' +
        renderSVG(avatar, '64') +
        '<div>' +
          '<div class="summary-name">' + escHtml(avatar.nickname) + '</div>' +
          '<div class="summary-balance">🪙 ' + balance + ' <span class="unit">coins</span></div>' +
          '<div class="summary-lifetime">Lifetime: +' + stats.earned + ' earned · -' + stats.spent + ' spent</div>' +
        '</div>' +
      '</div>';

    // ── Earn section ─────────────────────────────────────────────────────
    html +=
      '<div class="section">' +
        '<div class="section-label">Earn Coins</div>' +
        '<div class="earn-row">' +
          '<button class="btn-earn" data-earn="1">+1</button>' +
          '<button class="btn-earn" data-earn="5">+5</button>' +
          '<button class="btn-earn" data-earn="10">+10</button>' +
          '<button class="btn-earn" data-earn="20">+20</button>' +
        '</div>' +
        '<div class="exchange-panel earn-panel" id="earn-panel">' +
          '<div class="exchange-panel-title" id="earn-panel-title"></div>' +
          '<div class="exchange-row">' +
            '<input type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="earn-pin" placeholder="PIN">' +
          '</div>' +
          '<div class="exchange-row">' +
            '<button class="btn-earn-confirm">Confirm</button>' +
            '<button class="btn-exchange-cancel">Cancel</button>' +
          '</div>' +
          '<div class="exchange-error" id="earn-error"></div>' +
        '</div>' +
      '</div>';

    // ── Exchange section ────────────────────────────────────────────────
    html += '<div class="section"><div class="section-label">Exchange Coins</div>';
    REWARDS.forEach(function (r) {
      var canAfford = balance >= r.cost;
      html +=
        '<div class="reward-card">' +
          '<div class="reward-icon">' + r.icon + '</div>' +
          '<div class="reward-info">' +
            '<div class="reward-title">' + escHtml(r.title) + '</div>' +
            '<div class="reward-cost">🪙 ' + r.cost + ' coins</div>' +
          '</div>' +
          '<button class="btn-exchange" data-reward="' + r.id + '"' + (canAfford ? '' : ' disabled') + '>Exchange</button>' +
        '</div>' +
        '<div class="exchange-panel" id="exchange-' + r.id + '">' +
          '<div class="exchange-panel-title">Redeem "' + escHtml(r.title) + '" for ' + r.cost + ' coins</div>' +
          '<div class="exchange-row">' +
            '<input type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="exchange-pin" placeholder="PIN" data-reward="' + r.id + '">' +
          '</div>' +
          '<div class="exchange-row">' +
            '<button class="btn-exchange-confirm" data-reward="' + r.id + '">Confirm</button>' +
            '<button class="btn-exchange-cancel" data-reward="' + r.id + '">Cancel</button>' +
          '</div>' +
          '<div class="exchange-error" id="exchange-error-' + r.id + '"></div>' +
        '</div>';
    });
    html += '</div>';

    // ── History section ─────────────────────────────────────────────────
    html += '<div class="section"><div class="section-label">Exchange History</div><div class="history-list">';
    if (exchanges.length === 0) {
      html += '<div class="history-empty">No exchanges yet.</div>';
    } else {
      exchanges.forEach(function (ex) {
        html +=
          '<div class="history-row">' +
            '<div>' +
              '<div class="history-label">' + escHtml(ex.label) + '</div>' +
              '<div class="history-time">' + relTime(ex.at) + '</div>' +
            '</div>' +
            '<div class="history-cost">-' + ex.cost + '</div>' +
          '</div>';
      });
    }
    html += '</div></div>';

    root.innerHTML = html;
    if (openExchangeId) {
      var panel = document.getElementById('exchange-' + openExchangeId);
      if (panel) {
        panel.classList.add('visible');
        var pinInput = panel.querySelector('.exchange-pin');
        if (pinInput) pinInput.focus();
      }
    }
    if (openEarnAmount) {
      var earnPanel = document.getElementById('earn-panel');
      if (earnPanel) {
        document.getElementById('earn-panel-title').textContent = 'Add ' + openEarnAmount + ' coins — enter PIN';
        earnPanel.classList.add('visible');
        var earnPinInput = earnPanel.querySelector('.earn-pin');
        if (earnPinInput) earnPinInput.focus();
      }
    }
  }

  function closeExchangePanels() {
    root.querySelectorAll('.exchange-panel.visible').forEach(function (el) { el.classList.remove('visible'); });
    openExchangeId = null;
    openEarnAmount = null;
  }

  function submitExchange(rewardId) {
    var panel = document.getElementById('exchange-' + rewardId);
    var errorEl = document.getElementById('exchange-error-' + rewardId);
    var pin = panel.querySelector('.exchange-pin').value.trim();
    var reward = REWARDS.filter(function (r) { return r.id === rewardId; })[0];
    if (!reward) return;

    if (pin !== EXCHANGE_PIN) {
      errorEl.textContent = 'Incorrect PIN.';
      panel.querySelector('.exchange-pin').value = '';
      return;
    }
    var activeAvatar = getActive();
    var activeId = activeAvatar && activeAvatar.id;
    var newBalance = window.__avatarRedeem ? window.__avatarRedeem(activeId, reward.title, reward.cost) : null;
    if (newBalance === null) {
      errorEl.textContent = 'Insufficient balance.';
      return;
    }
    openExchangeId = null;
    render();
  }

  function submitEarn() {
    var panel = document.getElementById('earn-panel');
    var errorEl = document.getElementById('earn-error');
    var pin = panel.querySelector('.earn-pin').value.trim();

    if (pin !== EXCHANGE_PIN) {
      errorEl.textContent = 'Incorrect PIN.';
      panel.querySelector('.earn-pin').value = '';
      return;
    }
    var activeAvatar = getActive();
    var activeId = activeAvatar && activeAvatar.id;
    if (activeId && openEarnAmount && window.__avatarAddCoins) {
      window.__avatarAddCoins(activeId, openEarnAmount);
    }
    openEarnAmount = null;
    render();
  }

  root.addEventListener('click', function (e) {
    var t = e.target;

    if (t.classList.contains('btn-earn')) {
      var amount = parseInt(t.dataset.earn, 10);
      var wasVisible = openEarnAmount === amount;
      closeExchangePanels();
      if (!wasVisible && amount) {
        openEarnAmount = amount;
        var panel = document.getElementById('earn-panel');
        document.getElementById('earn-panel-title').textContent = 'Add ' + amount + ' coins — enter PIN';
        panel.classList.add('visible');
        var pinInput = panel.querySelector('.earn-pin');
        if (pinInput) pinInput.focus();
      }
      return;
    }

    if (t.classList.contains('btn-earn-confirm')) {
      submitEarn();
      return;
    }

    if (t.classList.contains('btn-exchange')) {
      var rewardId = t.dataset.reward;
      var wasVisible = openExchangeId === rewardId;
      closeExchangePanels();
      if (!wasVisible) {
        openExchangeId = rewardId;
        var panel = document.getElementById('exchange-' + rewardId);
        panel.classList.add('visible');
        var pinInput = panel.querySelector('.exchange-pin');
        if (pinInput) pinInput.focus();
      }
      return;
    }

    if (t.classList.contains('btn-exchange-cancel')) {
      closeExchangePanels();
      return;
    }

    if (t.classList.contains('btn-exchange-confirm')) {
      submitExchange(t.dataset.reward);
      return;
    }
  });

  root.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.classList.contains('exchange-pin')) {
      e.preventDefault();
      submitExchange(e.target.dataset.reward);
    } else if (e.target.classList.contains('earn-pin')) {
      e.preventDefault();
      submitEarn();
    }
  });

  window.addEventListener('pz-avatar-coins-change', render);
  window.addEventListener('pz-avatar-change', function () { closeExchangePanels(); render(); });

  render();

})();
</script>
</body>
</html>
