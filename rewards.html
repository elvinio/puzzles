<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#13111c">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Rewards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #13111c;
      --surface: #1c1730;
      --brd: #4c1d95;
      --p: #6d28d9;
      --p-lt: #7c3aed;
      --p-xl: #a78bfa;
      --p-text: #e2d9f3;
      --muted: #7c6fa0;
      --gold: #f0c040;
      --earn: #22c55e;
      --danger: #dc2626;
      --danger-lt: #ef4444;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      color: var(--p-text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px 16px 40px;
      gap: 14px;
      touch-action: manipulation;
      user-select: none;
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 60px;
    }
    .back-link:hover { color: var(--p-xl); }
    h1 {
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      font-weight: 900;
      color: var(--p-xl);
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* ── Avatar summary card ── */
    .summary-card {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 2px solid var(--brd);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .summary-card svg { border-radius: 14px; display: block; overflow: hidden; flex-shrink: 0; }
    .summary-name { font-size: 1.1rem; font-weight: 800; color: var(--p-xl); }
    .summary-balance {
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--gold);
      margin-top: 2px;
    }
    .summary-balance .unit { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
    .summary-lifetime { font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-top: 4px; }

    /* ── Sections ── */
    .section {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 2px solid var(--brd);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Earn buttons ── */
    .earn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-earn {
      flex: 1;
      min-width: 64px;
      background: var(--bg);
      border: 1.5px solid var(--earn);
      border-radius: 10px;
      color: var(--earn);
      font-size: 0.95rem;
      font-weight: 800;
      padding: 10px 8px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .btn-earn:active { background: rgba(34,197,94,0.15); }

    /* ── Reward cards ── */
    .reward-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 2px solid var(--brd);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .reward-icon { font-size: 1.8rem; flex-shrink: 0; }
    .reward-info { flex: 1; min-width: 0; }
    .reward-title { font-weight: 800; font-size: 0.95rem; }
    .reward-cost { font-size: 0.78rem; font-weight: 700; color: var(--gold); margin-top: 2px; }
    .btn-exchange {
      background: var(--p);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 8px 14px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      flex-shrink: 0;
    }
    .btn-exchange:active { background: var(--p-lt); }
    .btn-exchange:disabled { opacity: 0.4; pointer-events: none; }

    .btn-earn-item {
      background: var(--earn);
      border: none;
      border-radius: 10px;
      color: #0b2c17;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 8px 14px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      flex-shrink: 0;
    }
    .btn-earn-item:active { background: #16a34a; }

    .exchange-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(109,40,217,0.12);
      border: 1.5px solid var(--p-lt);
      border-radius: 10px;
      padding: 10px;
    }
    .exchange-panel.visible { display: flex; }
    .exchange-panel-title { font-size: 0.78rem; font-weight: 700; color: var(--p-xl); }
    .exchange-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .exchange-row input {
      flex: 1;
      min-width: 90px;
      background: var(--bg);
      border: 2px solid var(--brd);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--p-text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    .exchange-row input:focus { border-color: var(--p-lt); }
    .exchange-row select {
      flex: 1;
      min-width: 120px;
      background: var(--bg);
      border: 2px solid var(--brd);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--p-text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .exchange-row select:focus { border-color: var(--p-lt); }
    .btn-exchange-cancel {
      background: none;
      border: 1.5px solid var(--muted);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 7px 12px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
    }
    .exchange-error { font-size: 0.72rem; color: var(--danger-lt); font-weight: 700; min-height: 1em; }

    .earn-panel { background: rgba(34,197,94,0.1); border-color: var(--earn); }
    .earn-panel .exchange-panel-title { color: var(--earn); }
    .earn-panel .exchange-row input:focus { border-color: var(--earn); }

    /* ── Custom amount ── */
    .btn-custom-add {
      background: var(--earn);
      border: none;
      border-radius: 10px;
      color: #0b2c17;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 8px 14px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      flex-shrink: 0;
    }
    .btn-custom-add:active { background: #16a34a; }
    .btn-transfer-submit {
      background: var(--p);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 8px 14px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      flex-shrink: 0;
    }
    .btn-transfer-submit:active { background: var(--p-lt); }
    .btn-custom-deduct {
      background: var(--danger);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 8px 14px;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      flex-shrink: 0;
    }
    .btn-custom-deduct:active { background: var(--danger-lt); }

    /* ── Color-circle PIN gate ── */
    .color-gate { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 6px 0; }
    .color-dot {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .color-dot:active { transform: scale(0.9); }
    .color-dot.selected { border-color: #fff; transform: scale(1.1); }
    .gate-hint { font-size: 0.72rem; color: var(--muted); text-align: center; }

    /* ── History ── */
    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 10px;
      font-size: 0.82rem;
    }
    .history-label { font-weight: 700; }
    .history-time { color: var(--muted); font-size: 0.7rem; }
    .history-cost { color: var(--danger-lt); font-weight: 800; flex-shrink: 0; }
    .history-cost.history-gain { color: var(--earn); }
    .history-empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 10px 0; }

    .empty-state {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state-text { font-size: 1rem; margin-bottom: 20px; }
    .btn-create-first {
      background: var(--p-lt);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      padding: 12px 28px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back-link" href="index.html">← Back</a>
    <h1>Rewards</h1>
    <div style="min-width:60px"></div>
  </div>

  <div id="rewards-root" style="width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;align-items:center;"></div>

<script src="version.js"></script>
<script src="sync-registry.js"></script>
<script src="sync-merge.js"></script>
<script src="sync-drive.js"></script>
<script src="sync-ui.js"></script>
<script src="avatar.js"></script>
<script src="app.js"></script>
<script>
(function () {
  'use strict';

  var loadAvatars  = window.__avatarLoadAvatars;
  var getActive    = window.__avatarGetActive;
  var renderSVG    = window.__avatarRender;

  var REWARDS = [
    { id: 'series',   icon: '📺', title: 'Watch a series',        cost: 20 },
    { id: 'movie',    icon: '🎬', title: 'Watch a movie',         cost: 60 },
    { id: 'nintendo', icon: '🎮', title: '30 mins Nintendo play', cost: 50 },
    { id: 'pokopia',  icon: '⚡', title: 'Pokopia (Pokémon)',     cost: 2000 }
  ];

  var EARN_ITEMS = [
    { id: 'brush-teeth',  icon: '🪥', title: 'Brush teeth',              amount: 1 },
    { id: 'chinese-100',  icon: '🇨🇳', title: '100% Chinese spelling',    amount: 20 },
    { id: 'english-100',  icon: '🇬🇧', title: '100% English spelling',    amount: 10 }
  ];

  var COLORS = [
    { name: 'red',    hex: '#ef4444' },
    { name: 'blue',   hex: '#3b82f6' },
    { name: 'green',  hex: '#22c55e' },
    { name: 'yellow', hex: '#eab308' },
    { name: 'purple', hex: '#a855f7' },
    { name: 'orange', hex: '#f97316' }
  ];
  var CORRECT_COLORS = ['blue', 'red'];

  var openExchangeId = null;
  var openEarnAmount = null;
  var openEarnKey = null;
  var openEarnLabel = null;
  var openCustomMode = null;
  var openCustomAmount = null;
  var openTransferTo = null;
  var openTransferAmount = null;
  var openTransferToName = null;
  var gateSelections = {};

  var root = document.getElementById('rewards-root');

  function escHtml(str) {
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function relTime(iso) {
    if (!iso) return '';
    var ms = Date.parse(iso);
    if (isNaN(ms)) return '';
    var d = Date.now() - ms;
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.floor(d / 60000) + ' min ago';
    if (d < 86400000) return Math.floor(d / 3600000) + ' hr ago';
    return Math.floor(d / 86400000) + ' day(s) ago';
  }

  function shuffledColors() {
    var arr = COLORS.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function renderColorGate(gateKey) {
    var html = '<div class="gate-hint">Tap the 2 correct color circles</div><div class="color-gate">';
    shuffledColors().forEach(function (c) {
      html += '<button type="button" class="color-dot" data-gate="' + gateKey + '" data-color="' + c.name + '" style="background:' + c.hex + '" aria-label="color circle"></button>';
    });
    html += '</div>';
    return html;
  }

  function render() {
    var avatar = getActive();

    if (!avatar) {
      root.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state-icon">🎁</div>' +
          '<div class="empty-state-text">No avatar yet — create one to start earning rewards!</div>' +
          '<a class="btn-create-first" href="avatar.html">Create Your Avatar</a>' +
        '</div>';
      return;
    }

    var balance = avatar.coins || 0;
    var stats = window.__avatarGetCoinStats ? window.__avatarGetCoinStats(avatar.id) : { earned: 0, spent: 0 };
    var exchanges = window.__avatarGetExchanges ? window.__avatarGetExchanges(avatar.id) : [];

    var html = '';

    // ── Summary card ──────────────────────────────────────────────────────
    html +=
      '<div class="summary-card">' +
        renderSVG(avatar, '64') +
        '<div>' +
          '<div class="summary-name">' + escHtml(avatar.nickname) + '</div>' +
          '<div class="summary-balance">🪙 ' + balance + ' <span class="unit">coins</span></div>' +
          '<div class="summary-lifetime">Lifetime: +' + stats.earned + ' earned · -' + stats.spent + ' spent</div>' +
        '</div>' +
      '</div>';

    // ── Earn section ─────────────────────────────────────────────────────
    html +=
      '<div class="section">' +
        '<div class="section-label">Earn Coins</div>' +
        '<div class="earn-row">' +
          '<button class="btn-earn" data-earn="1">+1</button>' +
          '<button class="btn-earn" data-earn="5">+5</button>' +
          '<button class="btn-earn" data-earn="10">+10</button>' +
          '<button class="btn-earn" data-earn="20">+20</button>' +
        '</div>';

    EARN_ITEMS.forEach(function (it) {
      html +=
        '<div class="reward-card">' +
          '<div class="reward-icon">' + it.icon + '</div>' +
          '<div class="reward-info">' +
            '<div class="reward-title">' + escHtml(it.title) + '</div>' +
          '</div>' +
          '<button class="btn-earn-item" data-earn-item="' + it.id + '">+' + it.amount + '</button>' +
        '</div>';
    });

    html +=
        '<div class="exchange-panel earn-panel" id="earn-panel">' +
          '<div class="exchange-panel-title" id="earn-panel-title"></div>' +
          renderColorGate('earn') +
          '<div class="exchange-row">' +
            '<button class="btn-exchange-cancel">Cancel</button>' +
          '</div>' +
          '<div class="exchange-error" id="earn-error"></div>' +
        '</div>' +
      '</div>';

    // ── Custom amount section ───────────────────────────────────────────
    html +=
      '<div class="section">' +
        '<div class="section-label">Custom Amount</div>' +
        '<div class="exchange-row">' +
          '<input type="number" inputmode="numeric" min="1" step="1" id="custom-amount-input" placeholder="Amount">' +
          '<button class="btn-custom-add">➕ Add</button>' +
          '<button class="btn-custom-deduct">➖ Deduct</button>' +
        '</div>' +
        '<div class="exchange-error" id="custom-input-error"></div>' +
        '<div class="exchange-panel earn-panel" id="custom-add-panel">' +
          '<div class="exchange-panel-title" id="custom-add-title"></div>' +
          renderColorGate('custom-add') +
          '<div class="exchange-row">' +
            '<button class="btn-exchange-cancel">Cancel</button>' +
          '</div>' +
          '<div class="exchange-error" id="custom-add-error"></div>' +
        '</div>' +
        '<div class="exchange-panel" id="custom-deduct-panel">' +
          '<div class="exchange-panel-title" id="custom-deduct-title"></div>' +
          renderColorGate('custom-deduct') +
          '<div class="exchange-row">' +
            '<button class="btn-exchange-cancel">Cancel</button>' +
          '</div>' +
          '<div class="exchange-error" id="custom-deduct-error"></div>' +
        '</div>' +
      '</div>';

    // ── Transfer section ────────────────────────────────────────────────
    var otherAvatars = (window.__avatarLoadAvatars ? window.__avatarLoadAvatars() : [])
      .filter(function (a) { return a.id !== avatar.id; });

    if (otherAvatars.length > 0) {
      html +=
        '<div class="section">' +
          '<div class="section-label">Transfer Coins</div>' +
          '<div class="exchange-row">' +
            '<select id="transfer-target-select">' +
              otherAvatars.map(function (a) {
                return '<option value="' + a.id + '">' + escHtml(a.nickname) + '</option>';
              }).join('') +
            '</select>' +
            '<input type="number" inputmode="numeric" min="1" step="1" id="transfer-amount-input" placeholder="Amount">' +
            '<button class="btn-transfer-submit">↔️ Send</button>' +
          '</div>' +
          '<div class="exchange-error" id="transfer-input-error"></div>' +
          '<div class="exchange-panel earn-panel" id="transfer-panel">' +
            '<div class="exchange-panel-title" id="transfer-panel-title"></div>' +
            renderColorGate('transfer') +
            '<div class="exchange-row">' +
              '<button class="btn-exchange-cancel">Cancel</button>' +
            '</div>' +
            '<div class="exchange-error" id="transfer-error"></div>' +
          '</div>' +
        '</div>';
    }

    // ── Exchange section ────────────────────────────────────────────────
    html += '<div class="section"><div class="section-label">Exchange Coins</div>';
    REWARDS.forEach(function (r) {
      var canAfford = balance >= r.cost;
      html +=
        '<div class="reward-card">' +
          '<div class="reward-icon">' + r.icon + '</div>' +
          '<div class="reward-info">' +
            '<div class="reward-title">' + escHtml(r.title) + '</div>' +
            '<div class="reward-cost">🪙 ' + r.cost + ' coins</div>' +
          '</div>' +
          '<button class="btn-exchange" data-reward="' + r.id + '"' + (canAfford ? '' : ' disabled') + '>Exchange</button>' +
        '</div>' +
        '<div class="exchange-panel" id="exchange-' + r.id + '">' +
          '<div class="exchange-panel-title">Redeem "' + escHtml(r.title) + '" for ' + r.cost + ' coins</div>' +
          renderColorGate('exchange-' + r.id) +
          '<div class="exchange-row">' +
            '<button class="btn-exchange-cancel">Cancel</button>' +
          '</div>' +
          '<div class="exchange-error" id="exchange-error-' + r.id + '"></div>' +
        '</div>';
    });
    html += '</div>';

    // ── History section ─────────────────────────────────────────────────
    html += '<div class="section"><div class="section-label">History</div><div class="history-list">';
    if (exchanges.length === 0) {
      html += '<div class="history-empty">No history yet.</div>';
    } else {
      exchanges.forEach(function (ex) {
        var isEarn = ex.type === 'earn';
        html +=
          '<div class="history-row">' +
            '<div>' +
              '<div class="history-label">' + escHtml(ex.label) + '</div>' +
              '<div class="history-time">' + relTime(ex.at) + '</div>' +
            '</div>' +
            '<div class="history-cost' + (isEarn ? ' history-gain' : '') + '">' + (isEarn ? '+' + ex.amount : '-' + ex.cost) + '</div>' +
          '</div>';
      });
    }
    html += '</div></div>';

    root.innerHTML = html;
    if (openExchangeId) {
      var panel = document.getElementById('exchange-' + openExchangeId);
      if (panel) panel.classList.add('visible');
    }
    if (openEarnKey) {
      var earnPanel = document.getElementById('earn-panel');
      if (earnPanel) {
        var earnTitle = 'Add ' + openEarnAmount + ' coins' + (openEarnLabel ? ' for ' + openEarnLabel : '');
        document.getElementById('earn-panel-title').textContent = earnTitle;
        earnPanel.classList.add('visible');
      }
    }
    if (openCustomMode === 'add') {
      var addPanel = document.getElementById('custom-add-panel');
      if (addPanel) {
        document.getElementById('custom-add-title').textContent = 'Add ' + openCustomAmount + ' coins';
        addPanel.classList.add('visible');
      }
    }
    if (openCustomMode === 'deduct') {
      var deductPanel = document.getElementById('custom-deduct-panel');
      if (deductPanel) {
        document.getElementById('custom-deduct-title').textContent = 'Deduct ' + openCustomAmount + ' coins';
        deductPanel.classList.add('visible');
      }
    }
    if (openTransferTo) {
      var transferPanel = document.getElementById('transfer-panel');
      if (transferPanel) {
        document.getElementById('transfer-panel-title').textContent = 'Send ' + openTransferAmount + ' coins to ' + (openTransferToName || 'them');
        transferPanel.classList.add('visible');
      }
    }
  }

  function closeExchangePanels() {
    root.querySelectorAll('.exchange-panel.visible').forEach(function (el) { el.classList.remove('visible'); });
    root.querySelectorAll('.exchange-error').forEach(function (el) { el.textContent = ''; });
    gateSelections = {};
    openExchangeId = null;
    openEarnAmount = null;
    openEarnKey = null;
    openEarnLabel = null;
    openCustomMode = null;
    openCustomAmount = null;
    openTransferTo = null;
    openTransferAmount = null;
    openTransferToName = null;
  }

  function doExchange(rewardId) {
    var reward = REWARDS.filter(function (r) { return r.id === rewardId; })[0];
    if (!reward) return;
    var activeAvatar = getActive();
    var activeId = activeAvatar && activeAvatar.id;
    var newBalance = window.__avatarRedeem ? window.__avatarRedeem(activeId, reward.title, reward.cost) : null;
    if (newBalance === null) {
      var errorEl = document.getElementById('exchange-error-' + rewardId);
      if (errorEl) errorEl.textContent = 'Insufficient balance.';
      return;
    }
    openExchangeId = null;
    render();
  }

  function doEarn() {
    var activeAvatar = getActive();
    var activeId = activeAvatar && activeAvatar.id;
    if (activeId && openEarnAmount && window.__avatarAddCoins) {
      window.__avatarAddCoins(activeId, openEarnAmount, openEarnLabel || 'Coins added');
    }
    openEarnAmount = null;
    openEarnKey = null;
    openEarnLabel = null;
    render();
  }

  function doCustomAdd() {
    var activeAvatar = getActive();
    var activeId = activeAvatar && activeAvatar.id;
    if (activeId && openCustomAmount && window.__avatarAddCoins) {
      window.__avatarAddCoins(activeId, openCustomAmount, 'Custom top-up');
    }
    openCustomMode = null;
    openCustomAmount = null;
    render();
  }

  function doCustomDeduct() {
    var activeAvatar = getActive();
    var activeId = activeAvatar && activeAvatar.id;
    var newBalance = (activeId && openCustomAmount && window.__avatarRedeem) ?
      window.__avatarRedeem(activeId, 'Custom deduction', openCustomAmount) : null;
    if (newBalance === null) {
      var errorEl = document.getElementById('custom-deduct-error');
      if (errorEl) errorEl.textContent = 'Insufficient balance.';
      return;
    }
    openCustomMode = null;
    openCustomAmount = null;
    render();
  }

  function doTransfer() {
    var activeAvatar = getActive();
    var activeId = activeAvatar && activeAvatar.id;
    if (!(activeId && openTransferTo && openTransferAmount && window.__avatarTransferCoins)) {
      openTransferTo = null;
      openTransferAmount = null;
      openTransferToName = null;
      render();
      return;
    }
    var result = window.__avatarTransferCoins(activeId, openTransferTo, openTransferAmount);
    if (!result) {
      var errorEl = document.getElementById('transfer-error');
      if (errorEl) errorEl.textContent = 'Insufficient balance.';
      return;
    }
    openTransferTo = null;
    openTransferAmount = null;
    openTransferToName = null;
    render();
  }

  function runGateAction(gateKey) {
    if (gateKey === 'earn') { doEarn(); return; }
    if (gateKey === 'custom-add') { doCustomAdd(); return; }
    if (gateKey === 'custom-deduct') { doCustomDeduct(); return; }
    if (gateKey === 'transfer') { doTransfer(); return; }
    if (gateKey.indexOf('exchange-') === 0) { doExchange(gateKey.slice('exchange-'.length)); return; }
  }

  function gateErrorEl(gateKey) {
    if (gateKey === 'earn') return document.getElementById('earn-error');
    if (gateKey === 'custom-add') return document.getElementById('custom-add-error');
    if (gateKey === 'custom-deduct') return document.getElementById('custom-deduct-error');
    if (gateKey === 'transfer') return document.getElementById('transfer-error');
    if (gateKey.indexOf('exchange-') === 0) return document.getElementById('exchange-error-' + gateKey.slice('exchange-'.length));
    return null;
  }

  function resetGate(gateKey) {
    gateSelections[gateKey] = [];
    root.querySelectorAll('.color-dot[data-gate="' + gateKey + '"]').forEach(function (el) {
      el.classList.remove('selected');
    });
  }

  function handleColorDotClick(dot) {
    var gateKey = dot.dataset.gate;
    var color = dot.dataset.color;
    if (!gateSelections[gateKey]) gateSelections[gateKey] = [];
    var sel = gateSelections[gateKey];
    var idx = sel.indexOf(color);

    if (idx !== -1) {
      sel.splice(idx, 1);
      dot.classList.remove('selected');
      return;
    }
    if (sel.length >= 2) return;

    sel.push(color);
    dot.classList.add('selected');

    if (sel.length === 2) {
      var picked = sel.slice().sort();
      var correct = CORRECT_COLORS.slice().sort();
      var isCorrect = picked.length === correct.length && picked.every(function (c, i) { return c === correct[i]; });
      setTimeout(function () {
        if (isCorrect) {
          runGateAction(gateKey);
        } else {
          var errorEl = gateErrorEl(gateKey);
          if (errorEl) errorEl.textContent = 'Wrong colors. Try again.';
          resetGate(gateKey);
        }
      }, 200);
    }
  }

  root.addEventListener('click', function (e) {
    var t = e.target;

    if (t.classList.contains('color-dot')) {
      handleColorDotClick(t);
      return;
    }

    if (t.classList.contains('btn-earn')) {
      var amount = parseInt(t.dataset.earn, 10);
      var key = 'amt:' + amount;
      var wasVisible = openEarnKey === key;
      closeExchangePanels();
      if (!wasVisible && amount) {
        openEarnKey = key;
        openEarnAmount = amount;
        openEarnLabel = null;
      }
      render();
      return;
    }

    if (t.classList.contains('btn-earn-item')) {
      var itemId = t.dataset.earnItem;
      var item = EARN_ITEMS.filter(function (it) { return it.id === itemId; })[0];
      if (!item) return;
      var itemKey = 'item:' + itemId;
      var itemWasVisible = openEarnKey === itemKey;
      closeExchangePanels();
      if (!itemWasVisible) {
        openEarnKey = itemKey;
        openEarnAmount = item.amount;
        openEarnLabel = item.title;
      }
      render();
      return;
    }

    if (t.classList.contains('btn-custom-add')) {
      var addInput = document.getElementById('custom-amount-input');
      var addInputError = document.getElementById('custom-input-error');
      var addAmount = parseInt(addInput.value, 10);
      if (!addAmount || addAmount <= 0) {
        addInputError.textContent = 'Enter a valid coin amount.';
        return;
      }
      closeExchangePanels();
      openCustomMode = 'add';
      openCustomAmount = addAmount;
      render();
      return;
    }

    if (t.classList.contains('btn-custom-deduct')) {
      var deductInput = document.getElementById('custom-amount-input');
      var deductInputError = document.getElementById('custom-input-error');
      var deductAmount = parseInt(deductInput.value, 10);
      var activeAvatar = getActive();
      var currentBalance = activeAvatar ? (activeAvatar.coins || 0) : 0;
      if (!deductAmount || deductAmount <= 0) {
        deductInputError.textContent = 'Enter a valid coin amount.';
        return;
      }
      if (deductAmount > currentBalance) {
        deductInputError.textContent = 'Insufficient balance.';
        return;
      }
      closeExchangePanels();
      openCustomMode = 'deduct';
      openCustomAmount = deductAmount;
      render();
      return;
    }

    if (t.classList.contains('btn-transfer-submit')) {
      var targetSelect = document.getElementById('transfer-target-select');
      var transferAmountInput = document.getElementById('transfer-amount-input');
      var transferInputError = document.getElementById('transfer-input-error');
      var targetId = targetSelect ? targetSelect.value : '';
      var transferAmount = parseInt(transferAmountInput.value, 10);
      var activeAvatarForTransfer = getActive();
      var currentBalanceForTransfer = activeAvatarForTransfer ? (activeAvatarForTransfer.coins || 0) : 0;
      if (!targetId) {
        transferInputError.textContent = 'Choose someone to send coins to.';
        return;
      }
      if (!transferAmount || transferAmount <= 0) {
        transferInputError.textContent = 'Enter a valid coin amount.';
        return;
      }
      if (transferAmount > currentBalanceForTransfer) {
        transferInputError.textContent = 'Insufficient balance.';
        return;
      }
      var targetAvatar = (window.__avatarLoadAvatars ? window.__avatarLoadAvatars() : []).filter(function (a) { return a.id === targetId; })[0];
      closeExchangePanels();
      openTransferTo = targetId;
      openTransferAmount = transferAmount;
      openTransferToName = targetAvatar ? targetAvatar.nickname : '';
      render();
      return;
    }

    if (t.classList.contains('btn-exchange')) {
      var rewardId = t.dataset.reward;
      var wasVisible = openExchangeId === rewardId;
      closeExchangePanels();
      if (!wasVisible) {
        openExchangeId = rewardId;
      }
      render();
      return;
    }

    if (t.classList.contains('btn-exchange-cancel')) {
      closeExchangePanels();
      render();
      return;
    }
  });

  window.addEventListener('pz-avatar-coins-change', render);
  window.addEventListener('pz-avatar-change', function () { closeExchangePanels(); render(); });

  render();

})();
</script>
</body>
</html>
